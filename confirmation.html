<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Order Confirmed – Orbiva Technologies">
  <link rel="canonical" href="https://orbivagh.com/confirmation.html">
  <link rel="icon" type="image/jpeg" href="img/logo.jpeg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed – Orbiva Technologies</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    .confirm-page { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 60px 0; background: linear-gradient(135deg, #f0f9ff, #e0f2fe); }
    .confirm-card { background: #fff; border-radius: 24px; padding: 48px; text-align: center; max-width: 560px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.1); }
    .confirm-icon { width: 100px; height: 100px; background: linear-gradient(135deg, #16a34a, #22c55e); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 28px; font-size: 44px; color: #fff; animation: zoomIn 0.6s ease; }
    .confirm-card h1 { font-family: 'Poppins', sans-serif; font-size: 2rem; font-weight: 800; color: #0f172a; margin-bottom: 12px; }
    .confirm-card p { font-size: 15px; color: #64748b; line-height: 1.7; margin-bottom: 24px; }
    .order-num { background: rgba(29,78,216,0.08); border-radius: 12px; padding: 16px 24px; margin-bottom: 28px; }
    .order-num span { font-size: 13px; color: #64748b; display: block; margin-bottom: 4px; }
    .order-num strong { font-size: 22px; font-weight: 800; color: #1d4ed8; }
    .confirm-steps { display: flex; justify-content: center; gap: 24px; margin-bottom: 32px; flex-wrap: wrap; }
    .cs { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .cs-icon { width: 48px; height: 48px; background: rgba(29,78,216,0.08); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #1d4ed8; font-size: 18px; }
    .cs-label { font-size: 12px; font-weight: 600; color: #334155; }
    .cs-sep { width: 40px; height: 2px; background: #e2e8f0; align-self: center; }
    @keyframes zoomIn { from { opacity:0; transform:scale(0.5); } to { opacity:1; transform:scale(1); } }
    .order-detail-box { background: #f8fafc; border-radius: 12px; padding: 16px 20px; margin-bottom: 20px; font-size: 13px; text-align: left; }
    .order-detail-row { display: flex; justify-content: space-between; margin-bottom: 6px; gap: 12px; }
    .order-detail-row span:first-child { color: #64748b; flex-shrink: 0; }
    .order-detail-row strong { text-align: right; }
    .order-items-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; text-align: left; }
    .order-items-table td { padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
    .order-total-row { display: flex; justify-content: space-between; background: #1d4ed8; color: #fff; border-radius: 10px; padding: 14px 18px; font-size: 16px; font-weight: 800; margin-bottom: 20px; }
  </style>
</head>
<body>
<header class="header" style="position:sticky;top:0;z-index:900">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <img src="img/logo.jpeg" alt="Orbiva Technologies" class="logo-img">
    </a>
    <div class="header-actions">
      <button class="action-btn" id="accountToggle" title="Account"><i class="fas fa-user"></i></button>
    </div>
  </div>
</header>

<section class="confirm-page">
  <div class="confirm-card" id="confirmCard">
    <!-- Populated by JS once the real order is loaded -->
    <div style="padding:40px 0;color:#94a3b8"><i class="fas fa-spinner fa-spin" style="font-size:24px"></i></div>
  </div>
</section>
<nav class="bottom-nav" id="bottomNav">
  <a href="index.html" class="bottom-nav-item active">
    <i class="fas fa-home"></i>
    <span>Home</span>
  </a>
  <button class="bottom-nav-item" id="bnavCategories" onclick="openCategoryDrawer()">
    <i class="fas fa-list-ul"></i>
    <span>Categories</span>
  </button>
  <a href="shop.html" class="bottom-nav-item">
    <i class="fas fa-th-large"></i>
    <span>Shop</span>
  </a>
  <a href="shop.html?filter=flash" class="bottom-nav-item">
    <i class="fas fa-bolt"></i>
    <span>Deals</span>
  </a>
  <a href="shop.html" class="bottom-nav-item">
    <i class="fas fa-heart"></i>
    <span>Saved</span>
  </a>
</nav>

<div class="cat-drawer-backdrop" id="catDrawerBackdrop" onclick="closeCategoryDrawer()"></div>
<div class="cat-drawer" id="catDrawer">
  <div class="cat-drawer-handle"></div>
  <div class="cat-drawer-header">
    <h3>Shop by Category</h3>
    <button class="cat-drawer-close" onclick="closeCategoryDrawer()"><i class="fas fa-times"></i></button>
  </div>
  <div class="cat-drawer-list" id="catDrawerList"></div>
</div>

<script src="js/supabase.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  await (window.obvSyncPromise || Promise.resolve());
  renderConfirmationCard();
});

function renderConfirmationCard() {
  const card = document.getElementById('confirmCard');
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('order');
  const orders = JSON.parse(localStorage.getItem('obv_orders') || '[]');
  const order = orders.find(o => String(o.id) === orderId);

  if (!orderId || !order) {
    // Someone reached this page without a real order behind it — a stale
    // bookmark, a manually-typed URL, or similar. Say so plainly rather
    // than showing a fabricated confirmation for an order that may not
    // exist.
    card.innerHTML = `
      <div class="confirm-icon" style="background:linear-gradient(135deg,#94a3b8,#cbd5e1)"><i class="fas fa-question"></i></div>
      <h1>We couldn't find that order</h1>
      <p>This link may be outdated, or the order details aren't available on this device. If you just placed an order and see this, please check your Orders history or contact us directly.</p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <a href="index.html" class="btn-primary"><i class="fas fa-home"></i> Back to Home</a>
        <a href="contact.html" class="btn-outline"><i class="fas fa-headset"></i> Contact Us</a>
      </div>`;
    return;
  }

  const methodLabel = { momo: 'MTN Mobile Money', card: 'Card', cod: 'Cash on Delivery' }[order.paymentMethod] || order.paymentMethod;
  const isConfirmed = order.status === 'confirmed';
  const itemsHtml = (order.items || []).map(i => `
    <tr>
      <td>${i.name}<br><span style="font-size:11px;color:#94a3b8">SKU: ${i.model || i.sku || '—'}</span></td>
      <td style="text-align:center;color:#64748b">×${i.qty}</td>
      <td style="text-align:right;font-weight:600">GH₵ ${(i.price * i.qty).toLocaleString()}</td>
    </tr>`).join('');

  card.innerHTML = `
    <div class="confirm-icon"><i class="fas fa-check"></i></div>
    <h1>Order Confirmed!</h1>
    <p>Thank you for shopping with Orbiva! ${isConfirmed ? 'Your payment has been received and your order is being processed.' : 'Your order has been received and is being processed.'}</p>
    <div class="order-num">
      <span>Your Order Number</span>
      <strong>#${order.id}</strong>
    </div>
    <div class="confirm-steps">
      <div class="cs">
        <div class="cs-icon"><i class="fas fa-check-circle" style="color:#16a34a"></i></div>
        <span class="cs-label">${isConfirmed ? 'Paid' : 'Received'}</span>
      </div>
      <div class="cs-sep"></div>
      <div class="cs">
        <div class="cs-icon"><i class="fas fa-box"></i></div>
        <span class="cs-label">Packing</span>
      </div>
      <div class="cs-sep"></div>
      <div class="cs">
        <div class="cs-icon"><i class="fas fa-truck"></i></div>
        <span class="cs-label">On the Way</span>
      </div>
      <div class="cs-sep"></div>
      <div class="cs">
        <div class="cs-icon"><i class="fas ${order.fulfillment === 'pickup' ? 'fa-store' : 'fa-home'}"></i></div>
        <span class="cs-label">${order.fulfillment === 'pickup' ? 'Ready for Pickup' : 'Delivered'}</span>
      </div>
    </div>

    <div class="order-detail-box">
      <div class="order-detail-row"><span>Customer</span><strong>${order.customerName}</strong></div>
      <div class="order-detail-row"><span>Phone</span><strong>${order.phone}</strong></div>
      ${order.email ? `<div class="order-detail-row"><span>Email</span><strong>${order.email}</strong></div>` : ''}
      <div class="order-detail-row"><span>Fulfillment</span><strong>${order.fulfillment === 'pickup' ? 'Store Pickup' : 'Home Delivery'}</strong></div>
      ${order.deliveryArea && order.deliveryArea !== 'Store Pickup' ? `<div class="order-detail-row"><span>Address</span><strong>${order.deliveryArea}</strong></div>` : ''}
      <div class="order-detail-row"><span>Payment</span><strong>${methodLabel}${isConfirmed ? ' ✓' : ' (Pending)'}</strong></div>
      ${order.paymentRef ? `<div class="order-detail-row"><span>Ref</span><strong style="font-size:11px">${order.paymentRef}</strong></div>` : ''}
    </div>

    <table class="order-items-table">${itemsHtml}</table>
    <div class="order-total-row"><span>Total</span><span>GH₵ ${order.total.toLocaleString()}</span></div>

    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button onclick="downloadConfirmationReceipt(${order.id})" class="btn-outline"><i class="fas fa-download"></i> Download Receipt</button>
      <a href="index.html" class="btn-primary"><i class="fas fa-home"></i> Back to Home</a>
      <a href="shop.html" class="btn-outline"><i class="fas fa-shopping-bag"></i> Continue Shopping</a>
    </div>`;
}

function downloadConfirmationReceipt(orderId) {
  const orders = JSON.parse(localStorage.getItem('obv_orders') || '[]');
  const o = orders.find(x => String(x.id) === String(orderId));
  if (!o) return;
  const methodLabel = { momo: 'MTN Mobile Money', card: 'Card', cod: 'Cash on Delivery' }[o.paymentMethod] || o.paymentMethod;
  const itemsRows = (o.items || []).map(i =>
    `<tr><td>${i.name}<br><span style="font-size:11px;color:#94a3b8">SKU: ${i.model || i.sku || '—'}</span></td><td style="text-align:center">×${i.qty}</td><td style="text-align:right">GH₵ ${(i.price * i.qty).toLocaleString()}</td></tr>`
  ).join('');
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
  <link rel="canonical" href="https://orbivagh.com/confirmation.html"><title>Receipt - Order #${o.id}</title>
  <style>body{font-family:Arial,sans-serif;max-width:420px;margin:30px auto;color:#1e293b;font-size:13px}
  h1{font-size:20px;margin:0}.header{text-align:center;margin-bottom:20px;padding-bottom:16px;border-bottom:2px solid #1d4ed8}
  .info-row{display:flex;justify-content:space-between;margin:5px 0}
  .info-box{background:#f8fafc;border-radius:8px;padding:12px;margin-bottom:16px}
  table{width:100%;border-collapse:collapse;margin-bottom:12px}
  td{padding:7px 4px;border-bottom:1px solid #f1f5f9}
  .total-row{background:#1d4ed8;color:#fff;border-radius:8px;padding:12px;display:flex;justify-content:space-between;font-size:16px;font-weight:800}
  .footer{text-align:center;margin-top:16px;font-size:11px;color:#94a3b8}
  @media print{body{margin:10px}button{display:none}}</style></head>
  <body>
  <div class="header"><h1>Orbiva Technologies</h1><div style="font-size:11px;color:#64748b;margin:4px 0">ORDER RECEIPT</div>
  <div style="font-size:18px;font-weight:800">Order #${o.id}</div>
  <div style="color:${o.status==='confirmed'?'#16a34a':'#d97706'};font-weight:700">${o.status==='confirmed'?'✓ Payment Confirmed':'⏳ Pending Payment'}</div></div>
  <div class="info-box">
  <div class="info-row"><span style="color:#64748b">Customer</span><strong>${o.customerName}</strong></div>
  <div class="info-row"><span style="color:#64748b">Phone</span><strong>${o.phone}</strong></div>
  ${o.email?`<div class="info-row"><span style="color:#64748b">Email</span><strong>${o.email}</strong></div>`:''}
  <div class="info-row"><span style="color:#64748b">Fulfillment</span><strong>${o.fulfillment==='pickup'?'Store Pickup':'Home Delivery'}</strong></div>
  ${o.deliveryArea&&o.deliveryArea!=='Store Pickup'?`<div class="info-row"><span style="color:#64748b">Address</span><strong>${o.deliveryArea}</strong></div>`:''}
  <div class="info-row"><span style="color:#64748b">Payment</span><strong>${methodLabel}</strong></div>
  ${o.paymentRef?`<div class="info-row"><span style="color:#64748b">Ref</span><strong style="font-size:11px">${o.paymentRef}</strong></div>`:''}
  <div class="info-row"><span style="color:#64748b">Date</span><strong>${new Date(o.createdAt).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</strong></div>
  </div>
  <table>${itemsRows}</table>
  <div class="total-row"><span>Total</span><span>GH₵ ${o.total.toLocaleString()}</span></div>
  <div class="footer">Thank you for shopping with Orbiva Technologies · orbivagh.com</div>
  <br><button onclick="window.print()" style="width:100%;padding:10px;background:#1d4ed8;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer">🖨 Print / Save as PDF</button>
  </body></html>`;
  const w = window.open('', '_blank');
  w.document.write(html);
  w.document.close();
  setTimeout(() => w.print(), 600);
}
</script>

<!-- ============================================================
     ACCOUNT MODAL
============================================================ -->
<div class="modal" id="accountModal">
  <div class="modal-box">
    <button class="close-btn modal-close" id="closeAccount"><i class="fas fa-times"></i></button>
    <div id="signupFormView">
      <h2>Stay Updated</h2>
      <p class="modal-sub">Get notified about new products &amp; promotions</p>
      <form class="auth-form" id="registerForm">
        <div class="form-row-2">
          <div class="form-group">
            <label for="reg_fname">First Name</label>
            <input type="text" id="reg_fname" name="first_name" autocomplete="given-name" placeholder="John" required />
          </div>
          <div class="form-group">
            <label for="reg_lname">Last Name</label>
            <input type="text" id="reg_lname" name="last_name" autocomplete="family-name" placeholder="Doe" required />
          </div>
        </div>
        <div class="form-group">
          <label for="reg_email">Email Address</label>
          <input type="email" id="reg_email" name="email" autocomplete="email" placeholder="Enter your email" required />
        </div>
        <div class="form-group">
          <label for="reg_phone">Phone Number</label>
          <input type="tel" id="reg_phone" name="phone" autocomplete="tel" placeholder="+233 XX XXX XXXX" />
        </div>
        <p style="font-size:12px;color:var(--text-muted);line-height:1.5;margin:2px 0 14px">
          <i class="fas fa-info-circle"></i> We'll only use this to let you know about new products and promotions — nothing else, no spam.
        </p>
        <button type="submit" class="btn-primary btn-block">Sign Me Up</button>
      </form>
    </div>
    <div id="signupWelcomeView" style="display:none;text-align:center;padding:12px 4px">
      <div style="width:64px;height:64px;border-radius:50%;background:#dcfce7;color:#16a34a;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 18px">
        <i class="fas fa-check"></i>
      </div>
      <h2>Welcome, <span id="welcomeName"></span>!</h2>
      <p class="modal-sub" style="margin-bottom:22px">You're on the list — we'll let you know the moment new products and promotions land.</p>
      <button type="button" class="btn-primary btn-block" onclick="document.getElementById('accountModal').classList.remove('open');document.body.style.overflow=''">Continue Shopping</button>
    </div>
  </div>
</div>

</body>
</html>
